# main dalına her gönderimde siteyi derleyip GitHub Pages'te yayınlar.
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notify_slugs:
        description: 'Abonelere elle duyurulacak yazılar (dosya adı, virgülle; ör. ilk-yazim). Boş bırakılırsa duyuru yapılmaz.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın çalışır; süren yayın yarıda kesilmez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Paylaşım önizlemesindeki adresler için (scripts/prerender.mjs)
          SITE_URL: https://zeynepecren.github.io
          # Bülten formu (src/components/Newsletter.tsx); Settings → Secrets and variables → Actions → Variables
          VITE_BREVO_FORM_URL: ${{ vars.BREVO_FORM_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Yayın bittikten sonra yeni yazıları bülten abonelerine e-postayla duyurur (scripts/notify-subscribers.mjs).
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # önceki commit'teki yazılarla karşılaştırmak için
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/notify-subscribers.mjs
        env:
          SITE_URL: https://zeynepecren.github.io
          BEFORE_SHA: ${{ github.event.before }}
          NOTIFY_SLUGS: ${{ inputs.notify_slugs }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
